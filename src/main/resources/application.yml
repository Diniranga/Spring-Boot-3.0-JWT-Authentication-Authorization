spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jwtSecurity
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  application:
    security:
      jwt:
        expiration: 86400000
        refresh-token:
          expiration: 604800000 #7 days
        audience: pos-gateway-app
        issuer: pos-gateway
      https:
        enabled: false
        redirect-http: true
        hsts-enabled: true
        hsts-max-age: 31536000 # 1 year
      lockout:
        max-failed-attempts: 5
        cooldown-minutes: 15
      session:
        max-concurrent-sessions: 3
        session-timeout-minutes: 30
        cleanup-interval-minutes: 5

server:
  port: 8080
